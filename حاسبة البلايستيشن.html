<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة البلايستيشن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#ececec;--card:#fff;--ink:#171717;--mute:#626262;--line:#ddd;--pri:#171717;--pri2:#f3f3f3;--ok:#171717;--warn:#171717;--warnbg:#f4f4f4;color-scheme:light;font-family:'Cairo',Tahoma,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7}
.app{max-width:1160px;margin:auto;padding:40px 28px max(48px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 8px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand-icon{width:58px;height:58px;border-radius:18px 18px 18px 5px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0;transform:rotate(-5deg)}
.brand-icon svg{width:34px;height:34px;transform:rotate(5deg)}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.8px;line-height:1.5}
.tagline{margin:4px 0 0;color:var(--mute);font-size:13px}
h2{display:flex;align-items:center;gap:10px;margin:0 0 24px;font-size:18px;line-height:1.7}
.step{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:inline-grid;place-items:center;font-size:13px;flex-shrink:0;color:var(--mute)}
.card{min-width:0;background:var(--card);border:1px solid #d5d5d5;border-radius:20px;padding:28px}
.settings{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.grid>*{min-width:0}
label{display:block;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--mute)}
input,select{width:100%;min-width:0;min-height:48px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fafafa;color:var(--ink);font:inherit;font-size:16px}
input::placeholder{color:#737373;opacity:1}
input:hover,select:hover{border-color:#a3a3a3}
input:focus-visible,select:focus-visible,button:focus-visible,.table-scroll:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
small{display:block;font-size:11px;color:var(--mute);line-height:1.8;margin-top:6px}
button{min-height:46px;border:0;border-radius:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}
.b{background:var(--ink);color:#fff;padding:11px 20px}
.b:hover{background:#393939}
.g{background:#fff;color:var(--ink);border:1px solid #c8c8c8;padding:10px 16px}
.g:hover{background:#f3f3f3}
.add{display:flex;gap:10px;padding-bottom:22px}
.add input{flex:1;min-width:0}
.add button{flex-shrink:0}
#list{display:grid;gap:12px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'name remove' 'counter pay';align-items:center;gap:14px 12px;background:#f7f7f7;border:1px solid #e8e8e8;border-radius:14px;padding:16px}
.pl>input{grid-area:name;background:transparent;border:0;border-bottom:1px solid #ddd;border-radius:0;padding:4px 0;min-height:36px;font-weight:700}
.st{grid-area:counter;display:flex;align-items:center;gap:6px}
.st button{width:44px;min-width:44px;height:44px;min-height:44px;background:#fff;color:var(--ink);border:1px solid #d5d5d5;font-size:22px}
.st button:hover{background:var(--ink);color:#fff}
.st input{width:52px;min-height:44px;padding:4px 0;text-align:center;background:transparent;border:0;font-weight:800;font-variant-numeric:tabular-nums;appearance:textfield;-moz-appearance:textfield}
.st input::-webkit-inner-spin-button,.st input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.x{grid-area:remove;justify-self:end;background:transparent;color:var(--mute);width:44px;height:44px;font-size:24px;line-height:1}
.x:hover{background:#e4e4e4;color:#000}
.sh{grid-area:pay;font-size:22px;font-weight:800;text-align:end;overflow-wrap:anywhere;min-width:0;font-variant-numeric:tabular-nums}
.sh small{font-weight:400;font-size:10px;margin-top:0}
#res{border-top:4px solid var(--ink)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px}
.sum>div{background:#f5f5f5;border-radius:12px;padding:16px;font-size:12px;color:var(--mute);min-width:0;overflow-wrap:anywhere}
.sum b{display:block;color:var(--ink);font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.6}
.sum>div:last-child{background:var(--ink);color:#ddd;border-radius:12px 12px 12px 3px}
.sum>div:last-child b{color:#fff}
.warn{padding:14px 16px;margin-bottom:20px;border-inline-start:3px solid var(--ink);background:var(--warnbg);color:var(--warn);font-size:13px;border-radius:6px}
.table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:260px}
th,td{text-align:start;padding:14px 6px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
th{font-size:11px;color:var(--mute);font-weight:600}
th:first-child{width:30%}
td.n{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
tfoot td{border-bottom:0;padding-top:20px;font-weight:800}
.bar{height:3px;background:#e9e9e9;border-radius:2px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--ink)}
.act{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.act button{flex:1 1 140px}
.empty{text-align:center;color:var(--mute);padding:24px 12px}
@media(min-width:901px){#res{position:sticky;top:24px}}
@media(max-width:900px){.app{max-width:720px;grid-template-columns:minmax(0,1fr);padding:28px 20px 40px;gap:20px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:24px}}
@media(max-width:560px){.app{padding:22px 14px 32px;gap:18px}header{flex-wrap:wrap;gap:18px;padding-bottom:4px}.brand{gap:12px}.brand-icon{width:48px;height:48px;border-radius:14px 14px 14px 4px}.brand-icon svg{width:29px;height:29px}.tagline{font-size:12px}header>.g{width:100%}.card{padding:20px;border-radius:16px}h2{font-size:16px;margin-bottom:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.grid>:last-child{grid-column:1/-1}label{font-size:11px}.pl{padding:14px;gap:12px 8px}.sum>div{padding:14px 12px}.sum b{font-size:21px}.sh{font-size:20px}.sum{gap:10px}th,td{padding:12px 4px}}
@media(max-width:360px){.card{padding:16px}.grid{grid-template-columns:minmax(0,1fr)}.pl{padding:12px}.st{gap:2px}.st button{min-width:40px;width:40px}.st input{width:40px}.sh small{font-size:9px}.brand-icon{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
 <header>
 <div class="brand"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 9h12c4 0 7 13 4 15-2 2-5-3-7-3h-6c-2 0-5 5-7 3C3 22 6 9 10 9Z"/><path d="M11 13v6m-3-3h6"/><circle cx="22" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="24" cy="18" r="1" fill="currentColor" stroke="none"/></svg></div><div><h1>حاسبة البلايستيشن</h1><p class="tagline">الماتش خلص؟ نقسّم الحساب.</p></div></div>
 <button class="g" id="reset">بدء جلسة جديدة</button>
</header>

 <div class="card settings">
  <h2><span class="step" aria-hidden="true">١</span> إعدادات الجلسة</h2>
  <div class="grid">
   <div><label for="dur">مدة الماتش (دقيقة)</label><input id="dur" type="number" min="1" step="1" inputmode="numeric"></div>
   <div><label for="price">سعر الساعة (جنيه)</label><input id="price" type="number" min="0" step="any" inputmode="decimal"></div>
   <div><label for="hours">إجمالي ساعات القعدة</label><input id="hours" type="number" min="0" step="any" inputmode="decimal" placeholder="تلقائي"><small>سيبه فاضي لو عايزه يتحسب من الماتشات</small></div>
   <div><label for="ppm">عدد اللاعبين في الماتش</label><input id="ppm" type="number" min="1" step="1" inputmode="numeric"></div>
   <div><label for="rnd">تقريب المبلغ</label><select id="rnd"><option value="0">من غير تقريب</option><option value="1">لأقرب جنيه</option><option value="5">لأقرب ٥ جنيه</option><option value="10">لأقرب ١٠ جنيه</option></select></div>
  </div>
 </div>

 <div class="card">
  <h2><span class="step" aria-hidden="true">٢</span> اللاعبين والماتشات</h2>
  <div class="add"><input id="nm" aria-label="اسم اللاعب" placeholder="اسم اللاعب" maxlength="30"><button class="b" id="add">إضافة</button></div>
  <div id="list"></div>
 </div>

 <div class="card" id="res">
  <h2><span class="step" aria-hidden="true">٣</span> حساب القعدة</h2>
  <div id="out"></div>
 </div>
</div>

<script>
var KEY='ps-split-v1',S={dur:20,price:60,hours:'',ppm:2,rnd:1,pl:[{n:'أحمد',m:0},{n:'جوبا',m:0},{n:'الشاعر',m:0},{n:'زناتي',m:0},{n:'خالد',m:0},{n:'عاطف',m:0},{n:'مهند',m:0},{n:'كمال',m:0},{n:'عبدالله',m:0}]};
try{var sv=JSON.parse(localStorage.getItem(KEY));if(sv&&sv.pl)S=sv}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(n){return (Math.round(n*100)/100||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function num(v,d){var x=parseFloat(v);return isFinite(x)&&x>=0?x:d}

function calc(){
 var dur=num(S.dur,0),price=num(S.price,0),ppm=Math.max(1,num(S.ppm,1)),sumM=0;
 S.pl.forEach(function(p){sumM+=num(p.m,0)});
 var matches=sumM/ppm,played=matches*dur/60;
 var hrs=S.hours===''||S.hours==null?played:num(S.hours,played);
 var bill=hrs*price,step=num(S.rnd,0),rows=[],total=0;
 S.pl.forEach(function(p){
  var m=num(p.m,0),share=sumM?m/sumM*bill:0,pay=step?Math.ceil(share/step-1e-9)*step:share;
  total+=pay;rows.push({n:p.n,m:m,pct:sumM?m/sumM*100:0,pay:pay});
 });
 return{sumM:sumM,matches:matches,played:played,hrs:hrs,bill:bill,rows:rows,total:total,customHrs:S.hours!==''&&S.hours!=null};
}

function renderList(){
 var h='';
 S.pl.forEach(function(p,i){
  h+='<div class="pl"><input data-n="'+i+'" value="'+esc(p.n)+'" aria-label="الاسم">'
   +'<div class="st"><button data-d="'+i+'" aria-label="إنقاص">−</button><input data-m="'+i+'" type="number" min="0" step="1" inputmode="numeric" value="'+p.m+'" aria-label="عدد الماتشات"><button data-u="'+i+'" aria-label="زيادة">+</button></div>'
   +'<div class="sh" data-pay="'+i+'"></div><button class="x" data-x="'+i+'" aria-label="حذف">×</button></div>';
 });
 $('list').innerHTML=h||'<div class="empty">ضيف أول لاعب 👆</div>';
 renderOut();
}

function renderOut(){
 var c=calc(),h='';
 document.querySelectorAll('[data-pay]').forEach(function(el){
  var r=c.rows[el.getAttribute('data-pay')];
  if(r)el.innerHTML=f(r.pay)+' ج<small>'+r.m+' ماتش · '+f(r.pct)+'%</small>';
 });
 if(!S.pl.length){$('out').innerHTML='<div class="empty">لسه مفيش لاعبين.</div>';return}
 h+='<div class="sum"><div>إجمالي الماتشات<b>'+f(c.matches)+'</b></div><div>وقت اللعب الفعلي<b>'+f(c.played)+' ساعة</b></div><div>ساعات الحساب<b>'+f(c.hrs)+' ساعة</b></div><div>الفاتورة<b>'+f(c.bill)+' ج</b></div></div>';
 if(c.customHrs&&c.hrs<c.played-0.001)h+='<div class="warn">ساعات القعدة ('+f(c.hrs)+') أقل من وقت الماتشات الفعلي ('+f(c.played)+'). راجع الأرقام.</div>';
 if(c.customHrs&&c.hrs>c.played+0.001)h+='<div class="warn">فيه '+f(c.hrs-c.played)+' ساعة وقت ضايع بين الماتشات، وموزعة على الكل بنسبة ماتشاتهم.</div>';
 h+='<div class="table-scroll" role="region" aria-label="تفاصيل الحساب" tabindex="0"><table><thead><tr><th>اللاعب</th><th>الماتشات</th><th>النسبة</th><th>يدفع</th></tr></thead><tbody>';
 c.rows.forEach(function(r){h+='<tr><td>'+esc(r.n||'—')+'</td><td>'+r.m+'</td><td>'+f(r.pct)+'%<div class="bar"><i style="width:'+r.pct+'%"></i></div></td><td class="n">'+f(r.pay)+' ج</td></tr>'});
 h+='</tbody><tfoot><tr><td colspan="3">المجموع'+(c.total-c.bill>0.005?' (بعد التقريب)':'')+'</td><td>'+f(c.total)+' ج</td></tr></tfoot></table></div>';
 h+='<div class="act"><button class="b" id="cp">نسخ الحساب</button><button class="g" id="wa">إرسال واتساب</button></div>';
 $('out').innerHTML=h;
 var t=text(c);
 $('cp').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='تم النسخ ✓'},function(){window.prompt('انسخ الحساب:',t)})};
 $('wa').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
}

function text(c){
 var t='🎮 حساب البلايستيشن\nالفاتورة: '+f(c.bill)+' ج ('+f(c.hrs)+' ساعة × '+f(num(S.price,0))+')\n\n';
 c.rows.forEach(function(r){t+=r.n+': '+f(r.pay)+' ج ('+r.m+' ماتش)\n'});
 return t+'\nالمجموع: '+f(c.total)+' ج';
}

function init(){
 ['dur','price','hours','ppm','rnd'].forEach(function(k){
  var el=$(k);el.value=S[k];
  el.addEventListener('input',function(){S[k]=el.value;save();renderOut()});
 });
 $('add').onclick=addP;
 $('nm').addEventListener('keydown',function(e){if(e.key==='Enter')addP()});
 $('reset').onclick=function(){if(confirm('تصفير كل الماتشات وبدء جلسة جديدة؟')){S.pl.forEach(function(p){p.m=0});save();renderList()}};
 $('list').addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-n'))S.pl[t.getAttribute('data-n')].n=t.value;
  if(t.hasAttribute('data-m'))S.pl[t.getAttribute('data-m')].m=t.value===''?0:Math.max(0,parseInt(t.value,10)||0);
  save();renderOut();
 });
 $('list').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var d=t.getAttribute('data-d'),u=t.getAttribute('data-u'),x=t.getAttribute('data-x');
  if(d!=null)S.pl[d].m=Math.max(0,num(S.pl[d].m,0)-1);
  else if(u!=null)S.pl[u].m=num(S.pl[u].m,0)+1;
  else if(x!=null)S.pl.splice(x,1);
  else return;
  save();renderList();
 });
 renderList();
}
function addP(){var n=$('nm').value.trim();if(!n)return;S.pl.push({n:n,m:0});$('nm').value='';save();renderList();$('nm').focus()}
init();
</script>
</body>
</html>
